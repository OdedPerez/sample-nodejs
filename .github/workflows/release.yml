name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/odedperez/sample-nodejs
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ./actionlint -color

  verify:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

  dockerfile-lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < Dockerfile

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config auto --severity ERROR --error

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  version:
    name: Bump version
    runs-on: ubuntu-latest
    needs: [actionlint, verify, dockerfile-lint, sast, dependency-audit, secret-scan]
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

  build-scan-push:
    name: Build, scan, push (release)
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new_tag }}

      # Blocks deployment on any HIGH/CRITICAL finding.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new_tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (post-scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new_tag }}
            ${{ env.IMAGE_NAME }}:latest

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [version, build-scan-push]
    permissions:
      contents: read
    steps:
      # Checks out the GitOps repo (sample-nodejs-gitops)
      - uses: actions/checkout@v4
        with:
          repository: OdedPerez/sample-nodejs-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}

      - name: Bump staging/values.yaml image tag
        env:
          IMAGE_TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          sed -i -E "s/^(  tag: ).*/\1\"${IMAGE_TAG}\"/" staging/values.yaml
          grep "tag:" staging/values.yaml

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Render chart with the new tag before pushing
        run: helm template helm/sample-nodejs -f staging/values.yaml > /dev/null

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add staging/values.yaml
          git commit -m "chore(staging): deploy ${{ needs.version.outputs.new_tag }}"
          git push

  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [version, deploy-staging]
    # Requires a "production" GitHub Environment with a required reviewer
    # configured in repo settings. Makes the job pause for manual approval
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OdedPerez/sample-nodejs-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}

      - name: Bump production/values.yaml image tag
        env:
          IMAGE_TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          sed -i -E "s/^(  tag: ).*/\1\"${IMAGE_TAG}\"/" production/values.yaml
          grep "tag:" production/values.yaml

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Render chart with the new tag before pushing
        run: helm template helm/sample-nodejs -f production/values.yaml > /dev/null

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add production/values.yaml
          git commit -m "chore(prod): deploy ${{ needs.version.outputs.new_tag }}"
          git push
