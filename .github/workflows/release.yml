name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/odedperez/sample-nodejs
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Official install method from actionlint's own docs, rather than a
      # third-party wrapper action, to avoid uncertainty about an
      # unfamiliar action's exact input schema.
      - name: Install actionlint
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ./actionlint -color

  verify:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

  dockerfile-lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs hadolint's own official image directly via `docker run` on the
      # normal runner, rather than a third-party wrapper action (whose
      # exact default failure threshold turned out to be stricter than
      # local CLI testing suggested, failing this job for real in CI on
      # info-level findings) or a `container:`-scoped job (that image is a
      # minimal wrapper unlikely to have the Node.js/git actions/checkout
      # needs to run inside it). -t/--failure-threshold is hadolint's own
      # documented flag, verified locally first, same as the exit code
      # confirmed locally below.
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < Dockerfile

  helm-validate:
    name: Validate Helm chart (all environments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read-only, unauthenticated checkout of the GitOps repo - it's
      # public, and this job only needs to read staging/production's real
      # values files, not write anything.
      - uses: actions/checkout@v4
        with:
          repository: OdedPerez/sample-nodejs-gitops
          path: gitops

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Lint chart structure
        run: helm lint helm/sample-nodejs

      # Renders against every known environment's real values - including
      # staging/production, pulled from the separate GitOps repo above -
      # to catch a chart change that would break any of them, not just
      # confirm the chart is internally well-formed in isolation.
      - name: Render against every environment
        run: |
          helm template helm/sample-nodejs
          helm template helm/sample-nodejs -f helm/sample-nodejs/values-minikube.yaml
          helm template helm/sample-nodejs -f helm/sample-nodejs/values-dev.yaml
          helm template helm/sample-nodejs -f gitops/staging/values.yaml
          helm template helm/sample-nodejs -f gitops/production/values.yaml

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Self-contained, same reasoning as `verify`: don't assume
      # pr-checks.yml's sast job already ran - main can be pushed to
      # directly, not just via a reviewed PR (no branch protection
      # requiring PRs is configured on this repo), so this needs its own
      # gate rather than trusting the PR
      # path was taken.
      - name: Run Semgrep
        run: semgrep scan --config auto --severity ERROR --error

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Gated on high/critical only, same philosophy as the Trivy image
      # scan - moderate findings stay visible in the log but non-blocking.
      - run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  version:
    name: Bump version
    runs-on: ubuntu-latest
    needs: [actionlint, verify, dockerfile-lint, helm-validate, sast, dependency-audit, secret-scan]
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Conventional Commits since the last tag decide the bump:
      # fix: -> patch, feat: -> minor, BREAKING CHANGE/! -> major.
      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

  build-scan-push:
    name: Build, scan, push (release)
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU emulation lets the (amd64) runner cross-build for arm64 - needed
      # since the target deployment cluster (local minikube on Apple
      # Silicon) is arm64, not because we need multi-arch support broadly.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new_tag }}

      # Blocks push (and therefore deployment) on any HIGH/CRITICAL finding.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new_tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (post-scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new_tag }}
            ${{ env.IMAGE_NAME }}:latest

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [version, build-scan-push]
    permissions:
      contents: read
    steps:
      # Checks out the GitOps repo (sample-nodejs-gitops), not this one -
      # deployment state lives there, ArgoCD watches it directly. The
      # default GITHUB_TOKEN only has permissions within this repo, so a
      # PAT scoped to the GitOps repo (Contents: write) is required here.
      - uses: actions/checkout@v4
        with:
          repository: OdedPerez/sample-nodejs-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}

      - name: Bump staging/values.yaml image tag
        env:
          IMAGE_TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          sed -i -E "s/^(  tag: ).*/\1\"${IMAGE_TAG}\"/" staging/values.yaml
          grep "tag:" staging/values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add staging/values.yaml
          git commit -m "chore(staging): deploy ${{ needs.version.outputs.new_tag }}"
          git push

  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [version, deploy-staging]
    # Requires a "production" GitHub Environment with a required reviewer
    # configured in repo settings - that's what actually makes this job
    # pause for manual approval rather than just labeling the run.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OdedPerez/sample-nodejs-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}

      - name: Bump production/values.yaml image tag
        env:
          IMAGE_TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          sed -i -E "s/^(  tag: ).*/\1\"${IMAGE_TAG}\"/" production/values.yaml
          grep "tag:" production/values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add production/values.yaml
          git commit -m "chore(prod): deploy ${{ needs.version.outputs.new_tag }}"
          git push
