name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/odedperez/sample-nodejs
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

  sast:
    name: SAST (placeholder)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      # TODO: deliberately deferred - wire in Semgrep or CodeQL here, gated
      # to fail this job on critical findings. Left as an explicit stub
      # (rather than omitted) so downstream jobs already depend on it and
      # adding the real tool later doesn't require touching the DAG.
      - name: SAST placeholder
        run: |
          echo "::notice::SAST is intentionally deferred to a later iteration (see plan)."
          echo "TODO: add Semgrep/CodeQL, fail this job on critical severity findings."

  build-scan-push:
    name: Build, scan, push (dev tag)
    runs-on: ubuntu-latest
    needs: [lint, sast]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "tag=pr-${{ github.event.pull_request.number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}

      # Blocks the rest of the job (and therefore the push below) on any
      # HIGH/CRITICAL finding - nothing reaches the registry, so nothing is
      # deployable, unless the scan passes.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (post-scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}

  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: build-scan-push
    # Same-repo branches only: a fork's PR can't be granted contents:write
    # against this repo, so skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Bump values-dev.yaml image tag
        env:
          IMAGE_TAG: ${{ needs.build-scan-push.outputs.image_tag }}
        run: |
          sed -i -E "s/^(  tag: ).*/\1\"${IMAGE_TAG}\"/" helm/sample-nodejs/values-dev.yaml
          grep "tag:" helm/sample-nodejs/values-dev.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/sample-nodejs/values-dev.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(dev): deploy PR #${{ github.event.pull_request.number }} (${{ needs.build-scan-push.outputs.image_tag }}) [skip ci]"
            git push
          fi
