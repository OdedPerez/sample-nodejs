name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/odedperez/sample-nodejs
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Official install method from actionlint's own docs, rather than a
      # third-party wrapper action, to avoid uncertainty about an
      # unfamiliar action's exact input schema.
      - name: Install actionlint
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ./actionlint -color

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

  dockerfile-lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs hadolint's own official image directly via `docker run` on the
      # normal runner, rather than a third-party wrapper action (whose
      # exact default failure threshold turned out to be stricter than
      # local CLI testing suggested, failing this job for real in CI on
      # info-level findings) or a `container:`-scoped job (that image is a
      # minimal wrapper unlikely to have the Node.js/git actions/checkout
      # needs to run inside it). -t/--failure-threshold is hadolint's own
      # documented flag, verified locally first, same as the exit code
      # confirmed locally below.
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < Dockerfile

  helm-validate:
    name: Validate Helm chart (all environments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read-only, unauthenticated checkout of the GitOps repo - it's
      # public, and this job only needs to read staging/production's real
      # values files, not write anything.
      - uses: actions/checkout@v4
        with:
          repository: OdedPerez/sample-nodejs-gitops
          path: gitops

      - uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Lint chart structure
        run: helm lint helm/sample-nodejs

      # Renders against every known environment's real values - including
      # staging/production, pulled from the separate GitOps repo above -
      # to catch a chart change that would break any of them, not just
      # confirm the chart is internally well-formed in isolation.
      - name: Render against every environment
        run: |
          helm template helm/sample-nodejs
          helm template helm/sample-nodejs -f helm/sample-nodejs/values-minikube.yaml
          helm template helm/sample-nodejs -f helm/sample-nodejs/values-dev.yaml
          helm template helm/sample-nodejs -f gitops/staging/values.yaml
          helm template helm/sample-nodejs -f gitops/production/values.yaml

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # --config auto picks rulesets based on detected languages/frameworks
      # (Node/Express here). Gated on ERROR severity only, same "block on
      # the serious stuff, not on noise" philosophy as the Trivy image scan
      # gate - WARNING/INFO findings still print in the log for visibility
      # but don't fail the job.
      - name: Run Semgrep
        run: semgrep scan --config auto --severity ERROR --error

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Gated on high/critical only, same philosophy as the Trivy image
      # scan - moderate findings stay visible in the log but non-blocking.
      - run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-scan-push:
    name: Build, scan, push (dev tag)
    runs-on: ubuntu-latest
    needs: [actionlint, lint, dockerfile-lint, helm-validate, sast, dependency-audit, secret-scan]
    permissions:
      contents: read
      packages: write
    steps:
      # Default checkout for a pull_request event uses the auto-generated
      # merge commit (base+head merged), which has a different SHA than
      # the PR's actual head commit - pin explicitly so the tag computed
      # below matches ArgoCD's {{.head_sha}}/{{.head_short_sha_7}}, which
      # come from the real PR head via the GitHub API, not the merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # --short=7 forces exactly 7 hex chars, matching ArgoCD's
      # {{.head_short_sha_7}} PR-generator field (see
      # sample-nodejs-gitops/argocd/applicationset-dev.yaml) - both sides
      # must compute the same tag independently since nothing commits it
      # anywhere for the other side to read.
      - name: Compute image tag
        id: vars
        run: echo "tag=pr-${{ github.event.pull_request.number }}-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # QEMU emulation lets the (amd64) runner cross-build for arm64 - needed
      # since the target deployment cluster (local minikube on Apple
      # Silicon, including the per-PR dev environments) is arm64.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}

      # Blocks the rest of the job (and therefore the push below) on any
      # HIGH/CRITICAL finding - nothing reaches the registry, so nothing is
      # deployable, unless the scan passes.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (post-scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}

  # No deploy-dev job: the per-PR dev environment is entirely driven by
  # ArgoCD's sample-nodejs-dev ApplicationSet (see sample-nodejs-gitops),
  # which derives image.tag from the PR's own number + short SHA rather
  # than reading it from a git commit - nothing to push here.
