# Dev environment overlay.
# Deployed per-PR by sample-nodejs-gitops's ArgoCD ApplicationSet
# (argocd/applicationset-dev.yaml) - one isolated namespace per open PR,
# not a single shared dev environment. image.tag below is not actually
# used: the ApplicationSet overrides it via a Helm parameter, derived
# directly from each PR's own number + short SHA.

replicaCount: 1

autoscaling:
  enabled: false          # single replica, nothing to autoscale

podDisruptionBudget:
  enabled: false

topologySpreadConstraints:
  enabled: false

image:
  tag: ""                 # overwritten by CI on every PR push

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: dev.sample-nodejs.example.com
      paths:
        - path: /
          pathType: Prefix
